name: Web CI

on:
  push:
    branches:
      - main
    paths:
      - 'pigmie-web/**'
      - '.github/workflows/ci-web.yml'
      - 'pigmie-api/src/modules/loans/utils/**'
      - 'pigmie-api/package*.json'
      - 'pigmie-api/prisma/**'
  pull_request:
    branches:
      - main
    paths:
      - 'pigmie-web/**'
      - '.github/workflows/ci-web.yml'
      - 'pigmie-api/src/modules/loans/utils/**'
      - 'pigmie-api/package*.json'
      - 'pigmie-api/prisma/**'

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: pigmie-web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: pigmie-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install API contract-test dependencies
        working-directory: pigmie-api
        run: npm ci

      - name: Generate API Prisma Client for contract tests
        working-directory: pigmie-api
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Collection regression tests
        run: npm test

      - name: Build
        run: npm run build
