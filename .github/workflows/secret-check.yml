name: Secret checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify detection
        run: node --test scripts/check-secrets.test.mjs
      - name: Inspect repository files
        run: node scripts/check-secrets.mjs
